[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbhf"
version = "0.2.0"
description = "Hike & Fly track analysis: walk, flight and ride segmentation, D+/D-, FAI free distance, places"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
    "fitdecode>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mbhf = "mbhf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbhf = []

[tool.pytest.ini_options]
testpaths = ["tests"]
