[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbhf"
version = "0.1.0"
description = "Track analysis for the Mont-Blanc Hike & Fly challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7",
    "fitdecode>=0.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
mbhf = "mbhf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
