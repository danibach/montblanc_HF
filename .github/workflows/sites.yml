name: Take-off register

# Once a week (and when asked): refresh the take-off register from the FFVL open data and OpenStreetMap, and tie
# the published outings to their take-offs (scripts/sync_sites.py). New outings are tied as soon as the server
# checks them (process.yml); this run also picks up new official take-offs and frees the provisional ones they
# replace. Needs the same secrets as process.yml, and supabase/migration-2026-10-23-takeoff-sites.sql run once.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change"
        type: boolean
        default: false

concurrency:
  group: takeoff-register
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sync the take-off register
        run: |
          pip install --quiet .
          python scripts/sync_sites.py ${{ inputs.dry_run && '--dry-run' || '' }}
