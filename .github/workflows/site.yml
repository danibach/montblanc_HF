name: Site (tests, construction, publication)

# À chaque modification de la branche main : lance les tests, construit le site
# (analyse dans le navigateur), le vérifie dans un vrai navigateur, puis le publie
# sur GitHub Pages. Réglage nécessaire une fois : Settings > Pages > Source : GitHub Actions.
# Sur chaque pull request : les mêmes tests, construction et contrôle navigateur, SANS publication
# (coche verte ou croix rouge avant la fusion ; le job « build » peut être exigé dans Settings > Branches).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# main : un seul lancement à la fois, le plus récent l'emporte. Chaque pull request a son propre groupe : sa
# vérification n'annule jamais une publication de main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le programme et les outils de test
        run: pip install -e ".[dev]" playwright

      - name: Tests du programme d'analyse
        run: pytest -q

      - name: Construire le site
        run: python scripts/build_site.py --out _site

      - name: Vérifier le site dans un vrai navigateur
        run: |
          python -m playwright install --with-deps chromium
          python scripts/check_site.py _site --shots site-check

      - name: Garder les captures d'écran de la vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-site
          path: site-check/*.png
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
