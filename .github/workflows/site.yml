name: Site (tests, construction, publication)

# À chaque modification de la branche main : lance les tests, construit le site
# (analyse dans le navigateur), le vérifie dans un vrai navigateur, puis le publie
# sur GitHub Pages. Réglage nécessaire une fois : Settings > Pages > Source : GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer le programme et les outils de test
        run: pip install -e ".[dev]" playwright

      - name: Tests du programme d'analyse
        run: pytest -q

      - name: Construire le site
        run: python scripts/build_site.py --out _site

      - name: Vérifier le site dans un vrai navigateur
        run: |
          python -m playwright install --with-deps chromium
          python scripts/check_site.py _site --shots site-check

      - name: Garder les captures d'écran de la vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-site
          path: site-check/*.png
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
